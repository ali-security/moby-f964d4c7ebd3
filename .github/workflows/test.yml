name: test

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Stage module files
        shell: bash
        run: |
          # The repo is pre-module: it ships vendor.mod / vendor.sum instead of
          # go.mod / go.sum. Stage them so the toolchain can resolve packages.
          cp vendor.mod go.mod
          cp vendor.sum go.sum
      - name: Unit tests
        shell: bash
        run: |
          BASE="./client/... ./errdefs/... ./opts/... ./pkg/archive/... ./pkg/homedir/... ./pkg/idtools/... ./pkg/jsonmessage/... ./pkg/namesgenerator/... ./pkg/stdcopy/... ./pkg/stringid/... ./pkg/tailfile/... ./api/types/... ./pkg/authorization/..."
          if [ "$RUNNER_OS" = "Linux" ]; then
            PKGS="$BASE ./plugin/ ./daemon/"
            # TestImpliedDirectoryPermissions needs root (GitHub runners are non-root).
            # TestIfaceAddrs needs a network namespace (CAP_SYS_ADMIN).
            # TestExecSetPlatformOptAppArmor needs /sys/kernel/security/apparmor.
            SKIP="TestImpliedDirectoryPermissions|TestIfaceAddrs|TestExecSetPlatformOptAppArmor"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            PKGS="$BASE ./plugin/"
            # TestImpliedDirectoryPermissions needs root (GitHub runners are non-root).
            SKIP="TestImpliedDirectoryPermissions"
          else
            # ./plugin/ and ./daemon/ do not compile on darwin: internal/containerfs
            # and libnetwork/iptables have no darwin implementation files.
            PKGS="$BASE"
            # TestImpliedDirectoryPermissions needs root (GitHub runners are non-root).
            # TestChangesWithChangesGH13590 / TestApplyLayer differ on APFS+BSD
            # (chown, symlink and tar-layer behaviour); upstream never tests macOS.
            SKIP="TestImpliedDirectoryPermissions|TestChangesWithChangesGH13590|TestApplyLayer"
          fi
          echo "RUNNER_OS=$RUNNER_OS"
          echo "PKGS=$PKGS"
          echo "SKIP=$SKIP"
          go test -mod=vendor -count=1 -short -timeout 25m -skip "$SKIP" $PKGS

  integration-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Stage module files
        shell: bash
        run: |
          cp vendor.mod go.mod
          cp vendor.sum go.sum
      - name: Pre-tag frozen images
        shell: bash
        run: |
          # testutil/environment/frozen.go auto-pull is broken in this tree: it
          # greps the Dockerfile for "RUN ./contrib/download-frozen-image-v2.sh"
          # while the Dockerfile actually says "RUN /download-frozen-image-v2.sh
          # /build". TestMain panics unless the images already exist locally, so
          # pull and tag them up front.
          docker pull busybox:latest
          docker pull hello-world:latest
          docker pull debian:bookworm-slim
          docker tag busybox:latest busybox:glibc
          docker tag hello-world:latest hello-world:frozen
          docker tag hello-world:latest hello-world:amd64
          docker tag hello-world:latest hello-world:arm64
          docker image ls
      - name: Build dockerd from source
        shell: bash
        run: |
          # testutil/daemon spawns "dockerd" resolved from $PATH. The runner ships
          # its own (unpatched) dockerd, so without this the test-spawned daemon
          # would not contain our fix and the regression test would exercise the
          # wrong binary. Build the daemon from this tree and put it first on
          # $PATH. This mirrors hack/make/binary-daemon, which is just a static
          # build of ./cmd/dockerd.
          sudo apt-get install -y --no-install-recommends libseccomp-dev
          mkdir -p /tmp/dockerd-bin
          # Only the seccomp tag is needed here; "journald" would additionally
          # require libsystemd-dev and the log driver is irrelevant to this test.
          go build -mod=vendor -tags seccomp \
            -o /tmp/dockerd-bin/dockerd ./cmd/dockerd
          /tmp/dockerd-bin/dockerd --version
      - name: Provide containerd socket for test daemons
        shell: bash
        run: |
          # testutil/daemon defaults --containerd to
          # /var/run/docker/containerd/containerd.sock (where moby's own dev
          # container puts it). On a GitHub runner containerd is a system
          # service at /run/containerd/containerd.sock, so a test-spawned
          # dockerd blocks for its 1m connect timeout and then "exited and
          # never started". Link the expected path to the real socket; each
          # test daemon still gets its own --containerd-namespace, so it stays
          # isolated from the runner's own daemon.
          # "systemctl start" is idempotent: it is a no-op when already active.
          sudo systemctl start containerd
          for i in $(seq 1 30); do
            [ -S /run/containerd/containerd.sock ] && break
            sleep 1
          done
          test -S /run/containerd/containerd.sock
          sudo mkdir -p /var/run/docker/containerd
          sudo ln -sf /run/containerd/containerd.sock /var/run/docker/containerd/containerd.sock
          # /var/run/docker is root-only (0700), so stat it as root.
          sudo test -S /var/run/docker/containerd/containerd.sock
          sudo ls -l /var/run/docker/containerd/containerd.sock
      - name: Integration copy tests
        shell: bash
        run: |
          # The source declares API version 1.51; the runner's daemon is older and
          # TestMain panics with "client version is too new". Derive it at runtime.
          export DOCKER_API_VERSION="$(docker version --format '{{.Server.APIVersion}}')"
          # frozen.go opens filepath.Dir(cwd)/Dockerfile.
          export DOCKERFILE=../Dockerfile
          echo "DOCKER_API_VERSION=$DOCKER_API_VERSION"
          # Tests that spawn their own dockerd through testutil/daemon need root:
          # dockerd refuses to start unprivileged ("dockerd needs to be started
          # with root privileges"). Upstream runs the integration suite as root
          # inside its dev container; the GitHub runner's default user is not
          # root, so elevate here. -E keeps the exported vars above, and PATH is
          # forwarded explicitly so "go" and "dockerd" still resolve under sudo.
          # /tmp/dockerd-bin holds the dockerd built from THIS tree; it must come
          # first so testutil/daemon's exec.LookPath("dockerd") finds the patched
          # daemon rather than the runner's preinstalled one.
          sudo -E env "PATH=/tmp/dockerd-bin:$PATH" \
            go test -mod=vendor -count=1 -timeout 25m -run 'TestCopy' -v ./integration/container/

  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Restore pristine .github
        shell: bash
        run: |
          # The published Go module zip ships .github/** (all workflow files), so
          # our workflow edits must not leak into the artifact. Restore the
          # upstream v28.5.2 .github tree before zipping.
          curl -sSfL -o /tmp/upstream.tar.gz https://github.com/moby/moby/archive/refs/tags/v28.5.2.tar.gz
          mkdir -p /tmp/upstream
          tar -xzf /tmp/upstream.tar.gz -C /tmp/upstream
          rm -rf .github
          cp -r /tmp/upstream/moby-28.5.2/.github .github
      - name: Clean tree
        shell: bash
        run: |
          # The proxy zip contains neither go.mod nor go.sum; the absence of
          # go.mod is what makes this version "+incompatible".
          rm -rf .git
          rm -f go.mod go.sum
      - name: Build module-zip helper
        shell: bash
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          # The helper module dir must live outside $GOPATH.
          mkdir -p /tmp/helper
          cat > /tmp/helper/main.go <<'EOF'
          package main

          import (
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              f, err := os.Create(os.Args[2])
              if err != nil {
                  log.Fatal(err)
              }
              defer f.Close()
              v := module.Version{Path: "github.com/docker/docker", Version: "v28.5.2+incompatible"}
              if err := zip.CreateFromDir(f, v, os.Args[1]); err != nil {
                  log.Fatal(err)
              }
          }
          EOF
          cd /tmp/helper
          go mod init helper
          go get golang.org/x/mod@v0.24.0
          go build -o /tmp/create_mod .
      - name: Create module zip
        shell: bash
        run: |
          # Output lives outside the directory being zipped so the zip cannot
          # capture itself.
          mkdir -p /tmp/out
          /tmp/create_mod "$GITHUB_WORKSPACE" /tmp/out/v28.5.2+incompatible.zip
      - name: Append vendor/modules.txt
        shell: bash
        run: |
          # zip.CreateFromDir drops vendor/ entirely, but the reference zip keeps
          # vendor/modules.txt. zip -g uses the on-disk path as the entry name,
          # so stage the file under its exact in-zip path first.
          PREFIX='github.com/docker/docker@v28.5.2+incompatible'
          mkdir -p "/tmp/scratch/$PREFIX/vendor"
          cp "$GITHUB_WORKSPACE/vendor/modules.txt" "/tmp/scratch/$PREFIX/vendor/modules.txt"
          cd /tmp/scratch
          zip -g -X /tmp/out/v28.5.2+incompatible.zip "$PREFIX/vendor/modules.txt"
      - name: Verify zip contents
        shell: bash
        run: |
          PREFIX='github.com/docker/docker@v28.5.2+incompatible'
          unzip -l /tmp/out/v28.5.2+incompatible.zip | tail -5
          entries="$(unzip -Z1 /tmp/out/v28.5.2+incompatible.zip | wc -l)"
          echo "entry count: $entries"
          if ! unzip -Z1 /tmp/out/v28.5.2+incompatible.zip | grep -qx "$PREFIX/vendor/modules.txt"; then
            echo "ERROR: vendor/modules.txt missing from module zip"
            exit 1
          fi
          if unzip -Z1 /tmp/out/v28.5.2+incompatible.zip | grep -qx "$PREFIX/go.mod"; then
            echo "ERROR: go.mod present in module zip"
            exit 1
          fi
          if unzip -Z1 /tmp/out/v28.5.2+incompatible.zip | grep -qx "$PREFIX/go.sum"; then
            echo "ERROR: go.sum present in module zip"
            exit 1
          fi
          echo "module zip contents verified"
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp /tmp/out/v28.5.2+incompatible.zip "$GITHUB_WORKSPACE/out/v28.5.2+incompatible.zip"
      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: out/v28.5.2+incompatible.zip
          if-no-files-found: error
